---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p><em>{{ page.date | date: "%B %-d, %Y" }}</em></p>

  {{ content }}
</article>

<p class="view">
  {% if page.previous.url %}
  <a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>
  {% endif %}
  {% if page.previous.url and page.next.url %} | {% endif %}
  {% if page.next.url %}
  <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>
  {% endif %}
</p>
